# ============================================================
# Task Manager — Spring Boot Configuration
# ============================================================
# Tries MySQL first when db.mysql.enabled=true; otherwise H2.
# Env overrides: SERVER_PORT, DB_MYSQL_*, APP_NAME
# ============================================================

app.name=task-manager

server.port=8080

# H2 console is off by default (security). Enable only via the `dev` profile.

# Jackson: keep LocalDateTime as ISO strings
spring.jackson.serialization.write-dates-as-timestamps=false

# MySQL first, H2 fallback (custom DataSourceConfig)
db.mysql.enabled=true
db.mysql.url=jdbc:mysql://localhost:3306/taskdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.mysql.username=root
db.mysql.password=
db.mysql.driver=com.mysql.cj.jdbc.Driver

db.h2.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
db.h2.username=sa
db.h2.password=

logging.level.root=INFO
logging.level.com.tool.management=INFO
